[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recurrent-transformer-100m"
version = "0.1.0"
description = "A small Huginn-style recurrent-depth language model"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "sentencepiece>=0.2",
  "datasets>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recurrent-transformer = "recurrent_transformer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/recurrent_transformer"]
